plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hg.autoscroll'
    compileSdk 34

    defaultConfig {
        applicationId "com.hg.autoscroll"
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "1.10"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
